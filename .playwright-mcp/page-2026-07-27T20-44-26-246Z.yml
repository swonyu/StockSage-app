        - button "Learn More" [ref=e2245] [cursor=pointer]:
          - img [ref=e2246]: expand_more
      - paragraph [ref=e2247]:
        - text: The company announced a change in its ADS ratio from one ADS representing two Class A ordinary shares to one ADS representing sixty Class A ordinary shares.
        - superscript [ref=e2248]
        - text: This effectively functioned as a 1-for-30 reverse split, scheduled to take effect automatically on July 6, 2026.
        - superscript [ref=e2249]
        - text: No fractional new ADSs were to be issued; instead, fractional entitlements were aggregated, sold by the depositary bank (Citibank, N.A.), and the net cash proceeds distributed to holders.
