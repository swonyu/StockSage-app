        - button "Learn More" [ref=e2253] [cursor=pointer]:
          - img [ref=e2254]: expand_more
      - paragraph [ref=e2255]:
        - text: While a reverse split is a cosmetic corporate action that reduces outstanding shares and proportionally increases the per-share price without altering overall market capitalization
        - superscript [ref=e2256]
