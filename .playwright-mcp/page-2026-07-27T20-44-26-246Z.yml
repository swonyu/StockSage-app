      - paragraph [ref=e1988]:
        - generic [ref=e1989]:
          - text: The most critical behavioral redesign required in the
          - code [ref=e1990]: MarketsView.swift
          - text: layout is the implementation of a "Risk-First" Card Architecture.
        - superscript [ref=e1991]
        - text: In traditional retail trading interfaces, the visual prominence of potential upside metrics—such as Expected Value, Target returns, and Reward-to-Risk ratios—causes the user to anchor heavily on the reward.
        - superscript [ref=e1992]
        - text: This presentation sequence leads to confirmation bias and upside blindness, encouraging retail traders to accept mathematically poor setups because their visual cortex processed the potential gain before analyzing the structural risk.
        - superscript [ref=e1993]
        - button "Learn More" [ref=e1996] [cursor=pointer]:
          - img [ref=e1997]: expand_more
      - paragraph [ref=e1998]:
        - text: Operationalizing Prospect Theory and Loss Aversion principles, the StockSage primary ideas card layout must be entirely inverted.
